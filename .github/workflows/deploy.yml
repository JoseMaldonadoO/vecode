name: Deploy to Production (Hostinger)
# Force trigger: v45 (OE Documentation: Mandatory and Positive Programmed Tons)

on:
  push:
    branches:
      - main
      # Retry trigger: Connection timeout detected
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  web-deploy:
    name: 🎉 Deploy Production (Layout Check)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Build Assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          # Ensure manifest is in the right place
          if [ -f public/build/.vite/manifest.json ]; then
            cp public/build/.vite/manifest.json public/build/manifest.json
            echo "Moved .vite/manifest.json to root"
          fi

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, bcmath

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 🤐 Prepare Delivery Directory
        run: |
          mkdir delivery
          mkdir delivery/public
          # Copiar extractor a PUBLIC (Mecanismo de Despliegue Principal - Bypass FTP Cache)
          cp extract_debug.php delivery/public/extract_debug.php
          cp migrate.php delivery/public/migrate.php

          # Create ULTRA-LIGHT zip (Excluding vendor to prevent FTP timeouts)
          zip -r delivery/release_${{ github.run_number }}.zip . -x "vendor/*" ".git*" "node_modules/*" "storage/*" "tests/*" "*.env*" "phpunit.xml" "package.json" "package-lock.json" "vite.config.js" "tsconfig.json" "tailwind.config.js" "postcss.config.js" "README.md" "delivery/*"
          # Copy support scripts to delivery root
          cp extract.php delivery/
          cp extract_debug.php delivery/
          cp index.php delivery/
          cp fix_perms.php delivery/
          cp migrate.php delivery/
          cp deploy_health_check.php delivery/
          cp .htaccess delivery/
          # Delete state file from delivery directory to force full upload
          rm -f delivery/.ftp-deploy-zip-state.json

      - name: 📂 Sync release (Zip & Script)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/pro-agroindustria.com/public_html/
          local-dir: ./delivery/
          state-name: .ftp-deploy-zip-state.json
          log-level: verbose
          security: loose
          protocol: ftps
          port: 21
          timeout: 1200000

      - name: 🚀 Extract and Fix permissions
        run: |
          echo "Ejecutando extract_debug.php..."
          curl -v --max-time 180 https://pro-agroindustria.com/extract_debug.php
          echo "Ejecutando fix_perms.php..."
          curl -v --max-time 60 https://pro-agroindustria.com/fix_perms.php
          echo "Ejecutando migraciones..."
          curl -v --max-time 120 https://pro-agroindustria.com/migrate.php
          echo "Chequeo de salud final..."
          curl -v --max-time 60 https://pro-agroindustria.com/deploy_health_check.php
          echo "Despliegue completado e inspeccionado."
